<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strava Connection Successful</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #FFF8E1; /* Matches GardenScreen.tsx background */
            color: #4CAF50; /* Matches Hay Day green */
            text-align: center;
            padding: 50px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        p {
            font-size: 16px;
            margin-bottom: 30px;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #4CAF50; /* Hay Day green */
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #689F38; /* Darker green */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Strava Connection Successful!</h1>
        <p>Your Strava account has been linked to your garden. Please navigate back to the app!</p>
    </div>
</body>
</html>
